# Copy to secrets.yaml and replace every placeholder. The WebDAV keys are only
# needed if you uncomment http.auth in an example.

wifi_ssid: "REPLACE_WITH_WIFI_SSID"
wifi_password: "REPLACE_WITH_WIFI_PASSWORD"

# Paste the exact encryption key generated by the Home Assistant ESPHome add-on,
# or create one with: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_HOME_ASSISTANT_API_KEY"

ota_password: "REPLACE_WITH_OTA_PASSWORD"

# dav_username: "REPLACE_WITH_WEBDAV_USERNAME"
# dav_password: "REPLACE_WITH_WEBDAV_PASSWORD"
