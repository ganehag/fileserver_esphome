esphome:
  name: davbox-auto-volume
  friendly_name: davbox-auto-volume

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  # The auto-volume smoke script starts the emulator with this same test AP.
  ssid: auto-smoke
  password: auto-smoke-password

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../components
    components: [webdav_filing]

webdav_filing:
  http:
    port: 8080
    base_path: /dav
  storage:
    sd:
      # esp-emulator is launched with --sd card.img,cs=10.
      clk_pin: 12
      miso_pin: 13
      mosi_pin: 11
      cs_pin: 10
      frequency: 4MHz
