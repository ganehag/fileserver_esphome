# Test fixture for Espressif's esp-emulator, not a user board example.
# The fixed test Wi-Fi credentials are mirrored into the emulator's virtual AP
# by tests/run_emulator.sh.
esphome:
  name: davbox-s3
  friendly_name: davbox-s3

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: emulator-smoke
  password: emulator-smoke-password

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../components
    components: [webdav_filing]

webdav_filing:
  http:
    port: 8080
  storage:
    sd:
      # esp-emulator is launched with --sd card.img,cs=10.
      clk_pin: 12
      miso_pin: 13
      mosi_pin: 11
      cs_pin: 10
      frequency: 4MHz
